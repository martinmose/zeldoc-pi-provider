name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-26.04
    # Trusted publishing: npm accepts this workflow's OIDC token, from the npm
    # environment, instead of a stored token. Only v* tags can use that
    # environment, so a workflow on a branch cannot publish.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm release package.json's packageManager names.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Format check
        run: pnpm format

      - run: npm publish
