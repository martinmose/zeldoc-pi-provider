name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-26.04
    # NPM_TOKEN lives in the npm environment, which only v* tags can use, so a
    # workflow on a branch cannot read it.
    environment: npm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm release package.json's packageManager names.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Format check
        run: pnpm format

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
